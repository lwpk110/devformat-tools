name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 GitHub Pages 部署，避免并发覆盖
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # 先探测 Pages 是否启用：仓库可见性或 plan 不满足时 API 返回 404，
  # 此时跳过构建与部署，使 main 上的 run 保持 success 而非红叉
  check-pages:
    name: 检查 Pages 启用状态
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: 检查是否启用 Pages
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages 已启用，继续构建与部署"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages 未启用（仓库可见性或 plan 限制），跳过本次部署"
          fi

  build:
    name: 构建
    needs: check-pages
    if: needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
        env:
          # GitHub Pages 项目站点位于子路径，需注入 site 与 base
          SITE_URL: https://lwpk110.github.io
          BASE_PATH: /devformat-tools
      - name: Test
        run: npm test
        env:
          SITE_URL: https://lwpk110.github.io
          BASE_PATH: /devformat-tools
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: [build, check-pages]
    if: needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
