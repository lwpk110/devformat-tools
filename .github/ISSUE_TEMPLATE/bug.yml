name: Bug 报告
description: 报告一个可复现的软件缺陷
title: "fix: "
labels:
  - type:bug
  - status:ready
body:
  - type: markdown
    attributes:
      value: 请提供最小复现和可验证的预期行为。
  - type: textarea
    id: actual
    attributes:
      label: 当前行为
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 提供最小、稳定的复现步骤和输入。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 正确结果应是什么？
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器、Node.js、操作系统或相关版本。
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准与原子任务
      placeholder: "- [ ] 回归测试与修复任务"
    validations:
      required: true
